[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-bug-hunter-rhodawkai-edition"
version = "6.1.0"
description = "Fail-closed, CDN-aware autonomous bug bounty reconnaissance & attack-surface prioritization — deterministic reconFTW delegation, NVIDIA NIM & Ollama ready."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "RhodawkAI", email = "manager@rhodawkai.com" }]
keywords = ["security", "bug-bounty", "recon", "pentest", "ai-agent", "vulnerability", "reconftw", "mcp", "nvidia-nim", "ollama"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX",
    "Environment :: Console",
    "Topic :: Security",
    "Intended Audience :: Developers",
]
dependencies = [
    "requests>=2.32.3",
    "mcp>=1.28",
]

[project.optional-dependencies]
test = ["pytest>=8.3.2"]

[project.urls]
Homepage = "https://rhodawkai.com"
Repository = "https://github.com/Rhodawk-AI/Agentic-Bug-Hunter-RhodawkaiEdition"
Issues = "https://github.com/Rhodawk-AI/Agentic-Bug-Hunter-RhodawkaiEdition/issues"

[project.scripts]
rhodawk = "bughunter.__main__:main"
bughunter = "bughunter.__main__:main"
bughunter-agent = "bughunter.__main__:agent_main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["bughunter*"]

[tool.setuptools.package-data]
bughunter = ["**/*"]
