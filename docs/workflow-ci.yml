# Single-source template for .github/workflows/ci.yml (Step 3 launch hygiene).
# COPY TO: .github/workflows/ci.yml — via the GitHub web UI (Add file) or by
# pushing with a credential that has the 'workflow' scope (the current PAT
# has only 'repo', which GitHub refuses for workflow files). Content is
# identical to what this repo's PR ships.
name: ci

# Fast launch-hygiene gate (Step 3): shell syntax + full test suite on every
# push / PR to main. Complements .github/workflows/tests.yml (matrix pytest),
# keeping the repo badge green for the GitHub-trending launch.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-checks:
    name: shell syntax + pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: bash -n (shell syntax)
        run: bash -n bughunter/tools/recon_engine.sh install.sh install_tools.sh

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: pytest
        run: pytest -q
